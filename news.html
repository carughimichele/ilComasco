<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<title>ilComasco</title>
<!-- icone del sito: scheda del browser, segnalibri, schermata del telefono -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="ilComasco">
<!-- =====================================================================
     Vecchio indirizzo delle notizie (news.html?id=...).
     Da agosto 2026 ogni notizia ha una pagina sua: /notizia/<indirizzo>.
     In produzione ci pensa il rimando 301 scritto in vercel.json; questo
     file resta come rete di sicurezza per i link aperti senza passare
     dal server, per esempio in anteprima o in locale.
     ===================================================================== -->
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id');
  location.replace(id?'/notizia/'+encodeURI(id):'/notizie.html');
})();
</script>
</head>
<body><p>Un istante, ti porto alla notizia… <a href="/notizie.html">Tutte le notizie</a></p></body>
</html>
