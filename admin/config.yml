backend:
  name: github
  repo: ilComasco1907/ilComasco
  branch: main
  base_url: https://ilcomasco-oauth.vercel.app
media_folder: images
public_folder: /images

collections:
  - name: contenuti
    label: Contenuti
    files:
      - name: news
        label: Notizie
        file: data/news.json
        format: json
        fields:
          - label: Notizie
            name: news
            widget: list
            label_singular: Notizia
            summary: "{{fields.title}}"
            fields:
              - label: Indirizzo (non cambiarlo dopo)
                name: slug
                widget: string
                hint: "solo minuscole e trattini, es. nasce-ilcomasco"
              - label: Titolo
                name: title
                widget: string
              - label: Categoria
                name: cat
                widget: string
                default: Como
              - label: Data
                name: date
                widget: datetime
                date_format: "DD/MM/YYYY"
                time_format: false
                format: "YYYY-MM-DD"
              - label: Sommario (1 riga)
                name: summary
                widget: text
              - label: Testo completo
                name: body
                widget: markdown
